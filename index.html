<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ruivo | Briefing para Desenvolvimento de Websites</title>
<style>

:root {
  color-scheme: light;
  --canvas: #f3f6fc;
  --white: #fff;
  --ink: #132141;
  --muted: #4e5e78;
  --blue: #154fc5;
  --blue-dark: #113c99;
  --line: #dce5f1;
  --pale: #edf4ff;
  --shadow: 0 2px 5px #142d5b05, 0 12px 32px #142d5b07;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.5 Inter, "Segoe UI", Arial, sans-serif; }
h1, h2, h3, p { margin: 0; }
button, input, textarea { font: inherit; }
button { color: inherit; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid #2375e2; outline-offset: 3px; }
.hidden { display: none !important; }
.save-note { margin: 11px 3px 0; padding: 12px 5px 1px; border-top: 1px solid var(--line); color: var(--muted); display: flex; align-items: center; gap: 8px; font-size: 13px; }
.save-note::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #168059; box-shadow: 0 0 0 3px #e6f5ed; flex: none; }
.save-note[data-error]::before { background: #aa5b0f; box-shadow: 0 0 0 3px #fff1dc; }
.workspace { max-width: 1220px; margin-inline: auto; padding: 34px 28px 56px; display: grid; grid-template-columns: 252px minmax(0, 1fr); grid-template-areas: "side intro" "side main"; gap: 20px 26px; align-items: start; }
.intro { grid-area: intro; position: relative; isolation: isolate; overflow: hidden; border: 1px solid #d4e2f9; border-radius: 21px; padding: 26px 30px 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px; background: linear-gradient(112deg, #fff 32%, #e5f1ff 100%); }
.intro::after { content: ""; position: absolute; z-index: -1; width: 230px; height: 230px; right: -105px; top: -100px; border-radius: 55px; transform: rotate(-32deg); border: 1px solid #aecdfa; box-shadow: 0 0 0 19px #dceaff, 0 0 0 20px #c8dcf7, 0 0 0 39px #e4efff; pointer-events: none; }
.logo-filter { position: absolute; pointer-events: none; }
.intro #brandLogo { display: block; width: clamp(118px, 19vw, 220px); height: auto; filter: url(#logo-transparency); }
.intro h1 { font-size: clamp(30px, 4vw, 47px); line-height: 1.06; letter-spacing: -.052em; font-weight: 750; }
.intro p { color: var(--muted); margin-top: 9px; font-size: 15px; }
.side { grid-area: side; position: sticky; top: 20px; background: var(--white); border: 1px solid var(--line); border-radius: 19px; padding: 18px 12px 12px; box-shadow: var(--shadow); }
.progress { padding: 0 8px 15px; margin-bottom: 7px; border-bottom: 1px solid var(--line); }
.progress h2 { font-size: 16px; font-weight: 750; letter-spacing: -.025em; }
.count { margin-top: 5px; font-size: 12px; color: var(--muted); }
.progressLine { height: 6px; margin-top: 10px; border-radius: 10px; background: #e8eef8; overflow: hidden; }
.progressLine div { background: #2361d5; height: 100%; width: 0; border-radius: inherit; transition: width .2s ease; }
.stepnav { display: grid; gap: 3px; }
.stepnav button { width: 100%; min-height: 47px; padding: 7px 8px; background: transparent; border: 1px solid transparent; border-radius: 10px; text-align: left; display: grid; grid-template-columns: 27px 1fr; align-items: center; gap: 8px; font-size: 13px; line-height: 1.28; font-weight: 600; cursor: pointer; }
.stepnav button:hover { background: #f5f8fd; }
.stepnav button[aria-current="step"] { background: var(--pale); border-color: #d6e5ff; color: #143e90; font-weight: 700; }
.num { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 8px; background: #eef2f9; color: #4d607c; font-size: 12px; font-weight: 700; }
[aria-current="step"] .num { background: var(--blue); color: var(--white); }
.main { grid-area: main; min-width: 0; display: grid; gap: 18px; }
.panel { background: var(--white); border: 1px solid var(--line); border-radius: 19px; padding: 24px 28px; box-shadow: var(--shadow); scroll-margin-top: 16px; }
.panel h2, .summary-title { color: var(--ink); font-size: 23px; line-height: 1.2; letter-spacing: -.036em; font-weight: 750; }
.titleRow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 14px; flex-wrap: wrap; }
.subtitle { color: var(--muted); font-size: 14px; margin-top: 6px; }
.sectionBadge { color: #2658a7; font-size: 12px; font-weight: 700; white-space: nowrap; }
.meeting { padding: 0; }
.meeting summary { padding: 18px 28px; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-radius: 19px; }
.meeting summary::-webkit-details-marker { display: none; }
.meeting summary:hover { background: #f7faff; }
.summary-title { font-size: 19px; }
.chevron { width: 9px; height: 9px; margin-right: 3px; border-right: 2px solid #2658a7; border-bottom: 2px solid #2658a7; transform: rotate(45deg); }
.meeting[open] .chevron { transform: rotate(225deg); margin-top: 4px; }
.meeting-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px 14px; padding: 0 28px 20px; }
.field { min-width: 0; }
.field label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 6px; }
.field input, .field textarea { width: 100%; border: 1px solid #cdd9eb; background: #f8faff; border-radius: 9px; color: var(--ink); font-size: 15px; padding: 10px 12px; }
.field input { min-height: 43px; min-width: 0; }
.field textarea { min-height: 86px; resize: vertical; display: block; }
.field input:focus, .field textarea:focus { outline: 2px solid #2a70de; outline-offset: -1px; background: var(--white); }
.field input::placeholder, .field textarea::placeholder { color: #61728d; opacity: 1; }
#questionFields { margin-top: 18px; }
#questionFields .field { padding: 15px 0; border-top: 1px solid #e6edf6; }
#questionFields label { display: flex; align-items: baseline; gap: 10px; font-size: 15px; line-height: 1.4; margin-bottom: 9px; }
.qno { color: #2658a7; font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; }
.footnav, .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.footnav { justify-content: space-between; margin-top: 4px; padding-top: 16px; border-top: 1px solid #e6edf6; }
.button { min-height: 44px; border: 1px solid transparent; border-radius: 9px; padding: 9px 15px; font-size: 14px; font-weight: 700; cursor: pointer; }
.button:disabled { cursor: default; opacity: .55; }
.primary { background: var(--blue); color: var(--white); }
.primary:hover:not(:disabled) { background: var(--blue-dark); }
.outline { color: #153e8d; background: var(--white); border-color: #bdcdeb; }
.outline:hover:not(:disabled) { background: #f2f7ff; }
.finish { margin: 16px 0; padding: 12px 14px; background: var(--pale); border: 1px solid #d7e6ff; border-radius: 10px; color: #183e82; font-size: 14px; }
.print-report { display: none; }
@media (max-width: 900px) {
  .workspace { grid-template-columns: 212px minmax(0, 1fr); column-gap: 18px; }
  .meeting-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 690px) {
  .workspace { grid-template-columns: minmax(0, 1fr); grid-template-areas: "intro" "side" "main"; gap: 13px; padding: 16px 14px 34px; }
  .intro { padding: 20px; gap: 12px; }
  .intro #brandLogo { width: clamp(104px, 29vw, 170px); }
  .intro p { max-width: 260px; }
  .side { position: static; }
  .stepnav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stepnav button { min-height: 46px; }
  .panel, .meeting summary { padding: 17px 16px; }
  .meeting { padding: 0; }
  .meeting-grid { padding: 0 16px 17px; }
  .main { gap: 13px; }
  .field input, .field textarea { font-size: 16px; }
}
@media (max-width: 420px) {
  .intro h1 { font-size: 26px; }
  .intro p { font-size: 13px; }
  .meeting-grid { grid-template-columns: minmax(0, 1fr); }
  .actions .button { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}
@media print{
  @page{size:A4;margin:15mm}
  body{background:white;color:#182746;font:11pt/1.4 Arial,sans-serif}
  .layout{display:none!important}
  .print-report{display:block}
  .print-report header{display:flex;align-items:center;gap:16px;margin-bottom:18px;border-bottom:1px solid #dae4f1;padding-bottom:12px}
  .print-report img{width:140px;height:auto}
  .print-report h1{font-size:17pt;margin:0}
  .print-report h2{font-size:13pt;margin:18px 0 8px;break-after:avoid;color:#184ca0}
  .print-report h3{font-size:11pt;margin:10px 0 4px;break-after:avoid}
  .print-report p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;orphans:2;widows:2}
  .print-report dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0}
  .print-report dt{font-weight:bold}
  .print-report dd{margin:0;overflow-wrap:anywhere}
}
</style>
</head>

<article class="print-report" id="printReport"></article>
<script>
(()=>{'use strict';
const groups=[
{title:'Conhecendo a empresa',subtitle:'Entenda o negócio, o público e os diferenciais.',items:['Qual é o nome da empresa e qual seu principal ramo de atuação?','Quais produtos ou serviços a empresa oferece?','Quem é seu público-alvo?','Quais são os principais diferenciais da empresa em relação aos concorrentes?']},
{title:'Objetivo do website',subtitle:'Descubra o que o novo site deverá alcançar.',items:['Qual é o principal objetivo do novo website?','A empresa já possui um site ou será o primeiro?','Quais ações você deseja que o visitante realize no site?','Existem sites de concorrentes ou referências visuais que você gosta?']},
{title:'Conteúdo e identidade visual',subtitle:'Defina a aparência, linguagem e materiais disponíveis.',items:['A empresa já possui logotipo, cores e identidade visual definidos?','Quais páginas deseja incluir (Início, Sobre, Serviços, Contato etc.)?','Já possui textos, fotos, vídeos e outros materiais para o website?','Qual estilo visual melhor representa sua empresa: moderno, corporativo, minimalista ou outro?']},
{title:'Funcionalidades e tecnologia',subtitle:'Mapeie recursos técnicos e possíveis integrações.',items:['O site precisará de WhatsApp, formulários, agendamento, catálogo ou vendas online?','Haverá necessidade de áreas restritas, login ou painel administrativo?','Você deseja atualizar o conteúdo do site por conta própria?','A empresa já possui domínio e hospedagem contratados?']},
{title:'Investimento, prazo e manutenção',subtitle:'Alinhe expectativas para construir a proposta.',items:['Qual é o prazo desejado para colocar o website no ar?','Existe uma faixa de investimento prevista para o projeto?','Quem será o responsável pela aprovação dos conteúdos e do projeto?','A empresa deseja contratar manutenção, suporte e atualizações após a entrega?']},
{title:'Oportunidades adicionais',subtitle:'Identifique necessidades de automação, sistemas e inteligência artificial.',items:['Além do website, quais atividades da empresa são realizadas manualmente e poderiam ser facilitadas com tecnologia?']}
];
const TOTAL=groups.reduce((n,g)=>n+g.items.length,0),KEY='ruivo_briefing_web_v1',infoIds=['empresa','contato','email','telefone','data','responsavel'];
const meetingFields = [
  ['Empresa', 'empresa'], ['Entrevistado', 'contato'], ['E-mail', 'email'],
  ['Telefone / WhatsApp', 'telefone'], ['Data', 'data'], ['Entrevistador', 'responsavel']
];
let step=0,answers={},savedInfo={};try{const obj=JSON.parse(localStorage.getItem(KEY)||'{}');answers=obj.answers||{};savedInfo=obj.info||{};step=Math.min(groups.length-1,Math.max(0,obj.step||0));}catch(e){}
const $=id=>document.getElementById(id),escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!savedInfo.data) {
  const now = new Date();
  savedInfo.data = [now.getFullYear(), now.getMonth() + 1, now.getDate()]
    .map(value => String(value).padStart(2, '0')).join('-');
}
if(!savedInfo.responsavel)savedInfo.responsavel='Ruivo — Soluções em TI e IA';
infoIds.forEach(id=>{$(id).value=savedInfo[id]||'';$(id).addEventListener('input',save)});
function save() {
  savedInfo = Object.fromEntries(infoIds.map(id => [id, $(id).value]));
  const note = $('saveNote');
  try {
    localStorage.setItem(KEY, JSON.stringify({info: savedInfo, answers, step}));
    note.removeAttribute('data-error');
    if (note.textContent !== 'Rascunho salvo neste navegador') {
      note.textContent = 'Rascunho salvo neste navegador';
    }
  } catch {
    note.setAttribute('data-error', '');
    if (note.textContent !== 'Rascunho local indisponível') {
      note.textContent = 'Rascunho local indisponível';
    }
  }
  updateProgress();
}

function updateProgress() {
  const count = Object.values(answers).filter(answer => String(answer || '').trim()).length;
  const countText = `${count} de ${TOTAL} respostas preenchidas`;
  $('bar').style.width = (100 * count / TOTAL) + '%';
  $('count').textContent = countText;
  if (!$('endPanel').classList.contains('hidden')) {
    $('finishMessage').textContent = count < TOTAL
      ? `${countText}. O relatório exibirá “Não informado” nas respostas em branco.`
      : 'Todas as perguntas foram preenchidas. Seu relatório está pronto.';
  }
}

function focusPanel(panelId, headingId) {
  $(headingId).focus({ preventScroll: true });
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  $(panelId).scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
}

function showStep(index) {
  step = Math.max(0, Math.min(groups.length - 1, index));
  const group = groups[step];
  $('sectionTitle').textContent = group.title;
  $('sectionNumber').textContent = `Etapa ${step + 1} de ${groups.length}`;
  $('sectionDescription').textContent = group.subtitle;
  const initial = groups.slice(0, step).reduce((total, group) => total + group.items.length, 0);
  $('questionFields').innerHTML = group.items.map((question, offset) => {
    const id = initial + offset;
    const number = String(id + 1).padStart(2, '0');
    return `<div class="field">
      <label for="q${id}"><span class="qno" aria-hidden="true">${number}</span><span>${escapeHtml(question)}</span></label>
      <textarea id="q${id}" data-qi="${id}" placeholder="Resposta do cliente"></textarea>
    </div>`;
  }).join('');
  for (const field of document.querySelectorAll('[data-qi]')) {
    field.value = answers[field.dataset.qi] || '';
    field.addEventListener('input', () => {
      answers[field.dataset.qi] = field.value;
      save();
    });
  }
  $('previous').disabled = step === 0;
  $('next').textContent = step === groups.length - 1 ? 'Concluir entrevista →' : 'Próxima etapa →';
  for (const button of $('stepnav').querySelectorAll('[data-step]')) {
    if (Number(button.dataset.step) === step) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  }
  save();
}

function navigate(index) {
  showStep(index);
  focusPanel('questionPanel', 'sectionTitle');
}

$('stepnav').innerHTML = groups.map((group, index) =>
  `<button type="button" data-step="${index}" aria-controls="questionPanel"><span class="num" aria-hidden="true">${index + 1}</span><span>${escapeHtml(group.title)}</span></button>`
).join('');
$('stepnav').addEventListener('click', event => {
  const button = event.target.closest('[data-step]');
  if (button) navigate(Number(button.dataset.step));
});
$('previous').addEventListener('click', () => navigate(step - 1));
$('next').addEventListener('click', () => {
  if (step < groups.length - 1) {
    navigate(step + 1);
    return;
  }
  $('endPanel').classList.remove('hidden');
  updateProgress();
  focusPanel('endPanel', 'endTitle');
});
function allQuestions(){let n=0;return groups.map(g=>({title:g.title,items:g.items.map(question=>({number:++n,question,answer:(answers[n-1]||'').trim()||'Não informado'}))}))}
function meetingValue(id) {
  const value = savedInfo[id]?.trim();
  if (id === 'data' && value) return value.split('-').reverse().join('/');
  return value || 'Não informado';
}

function preparePrint() {
  save();
  const meta = meetingFields.map(([label, id]) =>
    `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(meetingValue(id))}</dd>`).join('');
  const sections = allQuestions().map(group =>
    `<section><h2>${escapeHtml(group.title)}</h2>` + group.items.map(item =>
      `<h3>${item.number}. ${escapeHtml(item.question)}</h3><p>${escapeHtml(item.answer)}</p>`
    ).join('') + '</section>'
  ).join('');
  $('printReport').innerHTML = `<header><img src="${$('brandLogo').src}" alt="Ruivo">
    <h1>Briefing de desenvolvimento de website</h1></header><dl>${meta}</dl>${sections}`;
}

window.addEventListener('beforeprint', preparePrint);
$('print').addEventListener('click', () => window.print());
showStep(step);
})();
</script>
